<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseFlow — Personal Finance Tracker</title>
  <meta name="description" content="Track income and expenses beautifully across all your devices." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <h1>Expense<span>Flow</span></h1>
      </div>
      <div class="header-right">
        <span class="user-email" id="userEmail"></span>
        <button id="addExpenseBtn" class="btn btn-primary btn-glow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add Transaction</span>
        </button>
        <button id="logoutBtn" class="btn btn-ghost btn-icon-only" title="Sign out">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ========== MAIN ========== -->
  <main class="main-content">
    <div class="dashboard-grid">

      <!-- LEFT: Monthly Summary -->
      <aside class="summary-panel">
        <div class="panel-card glass-card">
          <div class="summary-header">
            <h2>Monthly Overview</h2>
            <div class="month-nav">
              <button id="prevMonth" class="icon-btn" title="Previous month">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span id="currentMonth" class="month-label">Loading…</span>
              <button id="nextMonth" class="icon-btn" title="Next month">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </div>

          <!-- Balance / Income / Expense cards -->
          <div class="summary-cards">
            <div class="summary-stat balance-stat">
              <span class="stat-label">Balance</span>
              <span class="stat-amount balance-amount" id="balanceAmount">₹0.00</span>
            </div>
            <div class="summary-sub-row">
              <div class="summary-stat income-stat">
                <span class="stat-indicator income-dot"></span>
                <div>
                  <span class="stat-label">Income</span>
                  <span class="stat-amount income-amount" id="incomeAmount">₹0.00</span>
                </div>
              </div>
              <div class="summary-stat expense-stat">
                <span class="stat-indicator expense-dot"></span>
                <div>
                  <span class="stat-label">Expenses</span>
                  <span class="stat-amount expense-amount" id="expenseAmount">₹0.00</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Donut chart -->
          <div class="chart-container" id="chartContainer">
            <svg id="donutChart" viewBox="0 0 200 200" class="donut-chart"></svg>
            <div class="chart-center" id="chartCenter">
              <span class="chart-center-label">expenses</span>
              <span class="chart-center-count" id="chartCenterCount">0</span>
            </div>
            <div class="chart-empty" id="chartEmpty">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.35"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <p>No expenses this month</p>
            </div>
          </div>

          <div class="category-breakdown" id="categoryBreakdown"></div>
        </div>
      </aside>

      <!-- RIGHT: Transactions -->
      <section class="expenses-panel">

        <!-- Filters -->
        <div class="filters-bar glass-card">
          <div class="filter-row">
            <div class="search-wrap">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="searchInput" placeholder="Search transactions…" class="input" />
            </div>
            <select id="typeFilter" class="input select">
              <option value="">All Types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <select id="categoryFilter" class="input select">
              <option value="">All Categories</option>
              <optgroup label="Expenses">
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Bills">📄 Bills</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Other">📦 Other</option>
              </optgroup>
              <optgroup label="Income">
                <option value="Salary">💼 Salary</option>
                <option value="Freelance">💻 Freelance</option>
                <option value="Investment">📈 Investment</option>
              </optgroup>
            </select>
          </div>
          <div class="filter-row">
            <div class="date-range">
              <label class="date-label">From</label>
              <input type="date" id="dateFrom" class="input" />
            </div>
            <div class="date-range">
              <label class="date-label">To</label>
              <input type="date" id="dateTo" class="input" />
            </div>
            <button id="clearFilters" class="btn btn-ghost">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Clear
            </button>
          </div>
        </div>

        <!-- List -->
        <div id="expensesList" class="expenses-list"></div>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="empty-illustration">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.3">
              <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
          </div>
          <h3 id="emptyTitle">No transactions yet</h3>
          <p id="emptySubtitle">Click "Add Transaction" to start tracking your money.</p>
        </div>
      </section>
    </div>
  </main>

  <!-- ========== ADD / EDIT MODAL ========== -->
  <div id="expenseModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-container glass-card">
      <div class="modal-header">
        <h2 id="modalTitle">Add Transaction</h2>
        <button id="modalClose" class="icon-btn" title="Close" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="expenseForm" novalidate>

        <!-- Type toggle -->
        <div class="form-group">
          <label>Type <span class="required">*</span></label>
          <div class="type-toggle" id="typeToggle">
            <button type="button" class="type-btn active" data-type="expense">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Expense
            </button>
            <button type="button" class="type-btn" data-type="income">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              Income
            </button>
          </div>
          <input type="hidden" id="typeInput" value="expense" />
        </div>

        <div class="form-group">
          <label for="titleInput">Title <span class="required">*</span></label>
          <input type="text" id="titleInput" class="input" placeholder='e.g. "Coffee" or "Freelance payment"' maxlength="200" required />
          <span class="field-error" id="titleError"></span>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="amountInput">Amount (₹) <span class="required">*</span></label>
            <input type="number" id="amountInput" class="input" placeholder="0.00" step="0.01" min="0.01" required />
            <span class="field-error" id="amountError"></span>
          </div>
          <div class="form-group">
            <label for="dateInput">Date <span class="required">*</span></label>
            <input type="date" id="dateInput" class="input" required />
            <span class="field-error" id="dateError"></span>
          </div>
        </div>

        <div class="form-group">
          <label>Category <span class="required">*</span></label>
          <div class="category-pills expense-cats" id="expenseCatPills">
            <label class="pill"><input type="radio" name="category" value="Food" /><span>🍔 Food</span></label>
            <label class="pill"><input type="radio" name="category" value="Transport" /><span>🚗 Transport</span></label>
            <label class="pill"><input type="radio" name="category" value="Shopping" /><span>🛍️ Shopping</span></label>
            <label class="pill"><input type="radio" name="category" value="Bills" /><span>📄 Bills</span></label>
            <label class="pill"><input type="radio" name="category" value="Entertainment" /><span>🎬 Entertainment</span></label>
            <label class="pill"><input type="radio" name="category" value="Other" /><span>📦 Other</span></label>
          </div>
          <div class="category-pills income-cats" id="incomeCatPills" style="display:none;">
            <label class="pill"><input type="radio" name="category" value="Salary" /><span>💼 Salary</span></label>
            <label class="pill"><input type="radio" name="category" value="Freelance" /><span>💻 Freelance</span></label>
            <label class="pill"><input type="radio" name="category" value="Investment" /><span>📈 Investment</span></label>
          </div>
          <span class="field-error" id="categoryError"></span>
        </div>

        <div class="form-group">
          <label for="noteInput">Note <span class="optional">(optional)</span></label>
          <textarea id="noteInput" class="input textarea" placeholder="Any additional details…" maxlength="1000" rows="2"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submitBtn" class="btn btn-primary btn-glow">
            <span id="submitBtnText">Save</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== DELETE MODAL ========== -->
  <div id="deleteModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-container glass-card modal-small">
      <div class="delete-graphic">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </div>
      <h3>Delete this transaction?</h3>
      <p class="delete-desc">This cannot be undone.</p>
      <div class="form-actions">
        <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
        <button id="confirmDelete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
